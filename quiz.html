<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameQuiz - Quiz Gamer</title>
    <link rel="stylesheet" href="quiz.css">
</head>

<body>

<header>
    <a href="index.html" class="logo">🎮 Game<span>Quiz</span></a>

    <div id="contador">Pergunta 1 de 15</div>

    <div class="pontuacao">
        Acertos: <span id="score">0</span>
    </div>
</header>

<main>

    <div class="progresso">
        <div class="progresso-texto">
            <span>Seu progresso</span>
            <span id="porcentagem">7%</span>
        </div>

        <div class="barra">
            <div id="barraProgresso"></div>
        </div>
    </div>

    <section class="quiz">

        <div id="categoria">MINECRAFT</div>

        <h1 id="pergunta">
            Carregando pergunta...
        </h1>

        <div id="alternativas"></div>

        <p id="feedback"></p>

        <div class="botoes">
            <button id="voltar">← Voltar</button>
            <button id="proxima" disabled>Próxima →</button>
        </div>

    </section>

</main>

<script src="quiz.js"></script>

</body>
</html>
